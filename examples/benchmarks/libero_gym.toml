# EvoAB custom benchmark manifest. Fill in the paths, then register it with
#   evoab benchmarks add this-file.toml        (or paste it in Studio: 设置 → 评测集 → 添加评测集)
#
# The benchmark provides make(task_id, seed) returning a Gym-style environment:
#   reset() -> obs  or (obs, info)
#   step(action) -> (obs, reward, done, info)  or (obs, reward, terminated, truncated, info)
# where obs is a dict of arrays. The sections below map that environment onto EvoAB.

name = "libero_object_gym"            # lowercase id; becomes the runtime profile
title = "LIBERO-Object (Gym)"
description = "LIBERO object suite through its Gym-style environment"
python = "/path/to/venv/bin/python"   # interpreter that imports the benchmark and the evoab-runtime package
path = "/path/to/evoab/examples/benchmarks"   # added to sys.path before importing `make`
make = "libero_gym:make"
tasks_from = "libero_gym:TASKS"       # or list tasks inline with [[tasks]] id / instruction / max_steps
embodiment = "Franka Panda"
simulator = "MuJoCo (robosuite)"
control_hz = 20
max_steps = 280
# Optional: the embodiment and frame description shown to Direct policies.
prompt = ""

[environment]                         # extra variables for the benchmark process
MUJOCO_GL = "egl"
PYOPENGL_PLATFORM = "egl"
TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD = "1"     # LIBERO init states are pickled NumPy arrays
LIBERO_ROOT = "/path/to/LIBERO"       # used by the example: the checkout containing libero/libero

[observation]
cameras = { agentview = "agentview_image", wrist = "robot0_eye_in_hand_image" }
ee_pos = "robot0_eef_pos"
ee_quat = "robot0_eef_quat"
quat_order = "xyzw"
gripper = "robot0_gripper_qpos"       # finger joint positions; normalized with the two values below
gripper_reduce = "abs_sum"
gripper_open = 0.08
gripper_closed = 0.0
flip_vertical = true                  # robosuite renders images bottom-up
pose_description = "robosuite end-effector site of the Panda hand"

[action]
type = "delta_eef"                    # delta_eef: [dx, dy, dz, rx, ry, rz, gripper] in [-1, 1]; absolute_eef: [x, y, z, quat, gripper]
position_scale = 0.05                 # metres reached by a unit action (OSC_POSE output limit)
rotation_scale = 0.5                  # radians reached by a unit action
gripper_open = -1.0
gripper_closed = 1.0

[success]
method = "check_success"              # or info_key = "success"
