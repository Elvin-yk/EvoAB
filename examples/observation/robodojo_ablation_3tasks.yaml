# 3-task RoboDojo ablation observation pipeline (SAM3 + Mask-IoU NMS + FoundationPose 6D)
# Tasks: stack_blocks, insert_key, push_T
# Replace the relative mesh_path entries with your extracted metric OBJ meshes
# (relative paths resolve from this file's directory).
schema_version: 1

targets:
  by_task:
    stack_blocks:
      - label: purple_block
        prompt: "purple cube block on the table"
        mesh_path: "./meshes/block_00009.obj"
        color: "#B388FF"
      - label: white_block
        prompt: "white cube block on the table"
        mesh_path: "./meshes/block_00018.obj"
        color: "#00E5FF"
      - label: wooden_block
        prompt: "light yellow wooden cube block on the table"
        mesh_path: "./meshes/block_00015.obj"
        color: "#FFC400"

    insert_key:
      - label: key
        prompt: "silver metallic key on the table"
        mesh_path: "./meshes/key_00000.obj"
        color: "#00E5FF"
      - label: key_slot
        prompt: "copper key lock slot base on the table"
        mesh_path: "./meshes/key_slot_00000.obj"
        color: "#FFC400"

    push_T:
      - label: t_block
        prompt: "T-shaped block on the table"
        mesh_path: "./meshes/t_00000.obj"
        color: "#00E5FF"
      - label: target_t
        prompt: "gray T-shaped pad on the table"
        color: "#76FF03"

auto_prompt:
  enabled: true
  strategy: rule
  max_targets: 6

plugins:
  - type: sam3
    enabled: true
    fail_open: true
    options:
      endpoint_env: EVOAB_SAM3_URL
      min_score: 0.25
      compute_depth_geometry: true

  - type: foundationpose
    enabled: true
    fail_open: true
    options:
      endpoint_env: EVOAB_FOUNDATIONPOSE_URL
      route: "/estimate_pose"
      require_mask: true
      require_mesh: true
      timeout_s: 60.0

render:
  enabled: true
  draw_mask_fill: true
  mask_fill_alpha: 0.16
  draw_mask_contour: true
  contour_width: 2
  draw_bbox: true
  bbox_width: 2
  draw_labels: true
  draw_centroid_3d: true
  draw_pose_axes: true
  pose_axis_length_m: 0.05
  draw_bbox_3d: true
  draw_hud: true
  hud_position: bottom
  hud_max_items: 6

inject_metadata: true
dedup_iou_threshold: 0.55
enhance_step_snapshots: false
archive_images: true
