# A minimal harness baseline: four tools, compact results, an RGB observation in the first message.
id: clean
label: Clean baseline
summary: Four tools with compact results and an initial RGB observation.
roles:
  main:
    act: [tools]
    style: compact
    initial_observation: true
    capabilities:
      - {id: gripper, tools: [move, hold]}
      - {id: scene, tools: [capture_scene]}
      - episode
loop: {entry: main}
execution: {return_mode: immediate}
