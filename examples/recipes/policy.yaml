# Tools plus a VLA / world-action policy, which is just another tool (actor_act).
# evoab run --benchmark calvin --task open_drawer --recipe examples/recipes/policy.yaml --model my-model \
#   --action-model-url http://HOST:PORT --action-model-checkpoint-sha256 SHA256
id: policy
label: Tools + policy
summary: The agent hands contact-rich motion to an action model through actor_act and checks the result.
roles:
  main:
    act: [tools]
    capabilities:
      - skills
      - scene
      - {id: gripper, optional: true}
      - hybrid                     # actor_act: the VLA served at --action-model-url
      - episode
loop: {entry: main}
