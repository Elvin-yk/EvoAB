# Tools plus a VLA / world-action policy, which is just another tool (actor_act).
# evoab run --integration robodojo --task stack_bowls --recipe examples/recipes/policy.yaml --model my-model \
#   --action-model-url http://HOST:PORT
id: policy
label: Tools + policy
summary: The agent hands contact-rich motion to an action model through actor_act and checks the result.
roles:
  main:
    act: [tools]
    capabilities:
      - skills
      - scene
      - {id: gripper, optional: true}
      - hybrid                     # actor_act; options: {binding: robodojo_direct_eef} uses the model itself as the policy
      - episode
loop: {entry: main}
