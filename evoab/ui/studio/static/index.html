<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EvoAB Studio</title>
  <link rel="stylesheet" href="/static/studio.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="logo">E</span> EvoAB <span class="sub">Studio</span></div>

    <form id="launch" class="launch" autocomplete="off">
      <div class="section-title">新建运行</div>
      <label>环境 <select id="runtime"></select></label>
      <label>Benchmark <select id="benchmark"></select></label>
      <label>任务 <select id="task"></select></label>
      <div class="task-hint" id="taskHint"></div>
      <label>API <select id="provider"></select></label>
      <label>模型 <select id="model"></select></label>
      <div class="row">
        <label>推理强度 <select id="effort"></select></label>
        <label>工具集 <select id="actionProfile"></select></label>
      </div>
      <button type="submit" id="launchBtn">开始运行</button>
      <div class="form-status" id="formStatus" role="status"></div>
    </form>

    <div class="section-title runs-title">运行记录 <span id="runCount" class="count"></span></div>
    <nav id="runList" class="run-list"></nav>
    <a class="usage-link" href="#usage">额度总览</a>
  </aside>

  <main class="main">
    <section id="usageView" class="view">
      <h1>额度总览</h1>
      <p class="muted" id="rootInfo"></p>
      <div class="cards" id="usageCards"></div>
      <h2>按 API · 模型</h2>
      <table class="table" id="usageTable">
        <thead><tr><th>API · 模型</th><th>运行</th><th>成功</th><th>请求</th><th>输入 tokens</th><th>缓存命中</th><th>输出 tokens</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="runView" class="view" hidden>
      <div class="chips" id="chips"></div>
      <h1 id="runTitle"></h1>
      <p class="muted" id="runInstruction"></p>
      <div class="cards" id="runCards"></div>
      <div class="message" id="runMessage" hidden></div>
      <div class="actions">
        <button id="stopBtn" class="secondary" hidden>停止运行</button>
        <a id="openMonitor" class="secondary" target="_blank" rel="noopener">在新窗口打开回放</a>
      </div>
      <h2>可视化回放</h2>
      <div class="monitor-wrap"><iframe id="monitor" title="Run replay"></iframe></div>
    </section>
  </main>

  <script type="module" src="/static/studio.js"></script>
</body>
</html>
