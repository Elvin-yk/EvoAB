# RoboDojo builds locally from the Dockerfile in its pinned upstream checkout
# (Isaac Sim 5.1, IsaacLab, CuRobo on CUDA 12.8); no image is published. The
# checkout and the prepared assets stay on the host (container_data in
# deployment.py) and are mounted at the same paths. Isaac Sim lives under /root,
# so the service runs as root and run files are handed back afterwards.
build = "native"
python = "/root/miniconda3/envs/RoboDojo/bin/python"
gpu = true
root = true
license = "NVIDIA Isaac Sim EULA"
# Forwarded to the upstream build when set on the host (its documented mirror arguments).
build_args = ["UBUNTU_MIRROR", "PIP_INDEX_URL", "MINICONDA_URL", "CONDA_CHANNEL_MIRROR"]

[environment]
# The upstream image points Vulkan at /etc/vulkan/icd.d, but the NVIDIA Container
# Toolkit mounts the driver's ICD under /usr/share/vulkan/icd.d; without this Isaac
# Sim finds no Vulkan driver and no usable GPU.
VK_ICD_FILENAMES = "/usr/share/vulkan/icd.d/nvidia_icd.json"
VK_DRIVER_FILES = "/usr/share/vulkan/icd.d/nvidia_icd.json"
OMNI_KIT_ACCEPT_EULA = "YES"
ACCEPT_EULA = "Y"
PRIVACY_CONSENT = "Y"
