# LIBERO-Plus has no publicly pullable image, so setup builds `Dockerfile` (in
# this package) locally, then adds EvoAB's runtime layer. The recipe pins
# LIBERO-Plus 4976dc30028e805ff8094b55501d532c48fec182 (the revision EvoAB
# requires) and drops .git, so the local layer records that revision.
dockerfile = "Dockerfile"
python = "/opt/conda/envs/libero/bin/python"
native_root = "/app/LIBERO-plus"
gpu = true
prepare = ["printf %s 4976dc30028e805ff8094b55501d532c48fec182 > /app/LIBERO-plus/.evoab-revision"]

[environment]
MUJOCO_GL = "egl"
PYOPENGL_PLATFORM = "egl"
TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD = "1"

[[sources]]
path = "LIBERO-plus"
url = "https://github.com/sylvestf/LIBERO-plus.git"
ref = "4976dc30028e805ff8094b55501d532c48fec182"
