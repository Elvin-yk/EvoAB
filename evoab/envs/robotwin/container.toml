# RoboTwin has no publicly pullable image for the revision EvoAB pins, so setup
# builds `Dockerfile` (in this package) locally, then adds EvoAB's runtime layer.
# The recipe pins RoboTwin ea8b21121ebb3cd201ff5b3fe361944ac94eda3f and drops .git,
# so the local layer records that revision.
dockerfile = "Dockerfile"
python = "/opt/conda/envs/robotwin/bin/python"
native_root = "/app/RoboTwin"
gpu = true
prepare = ["printf %s ea8b21121ebb3cd201ff5b3fe361944ac94eda3f > /app/RoboTwin/.evoab-revision"]

[[sources]]
path = "RoboTwin"
url = "https://github.com/RoboTwin-Platform/RoboTwin.git"
ref = "ea8b21121ebb3cd201ff5b3fe361944ac94eda3f"

[[sources]]
path = "curobo"
url = "https://github.com/NVlabs/curobo.git"
ref = "v0.7.8"
