id: agentic
label: Agentic Policy
summary: One agent observes, calls robot tools and decides from their feedback in a persistent session.
paradigms: [orchestrate]
status: builtin
roles:
  main:
    description: Plans and acts with the shared scene, motion, skill and episode tools.
    channel: tools
    capabilities: [skills, scene, gripper, episode]   # tool modules; narrow one with {id: gripper, tools: [move, hold]}
    context: {policy: identity}    # identity: full transcript | sliding_window | observation_window (windows need a provider URL)
    prompt: {append: ""}           # extra method instructions
loop: {entry: main}
execution: {return_mode: background, resource_scheduling: per-resource}   # background: reasoning overlaps motion
