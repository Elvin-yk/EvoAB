# Direct Action: the model itself is the controller.
# Every inference is one stateless request (prompt, task, a few recent frames) whose only
# allowed answer is one action chunk; EvoAB executes the chunk, observes again and repeats.
# Change any value here, or for one run with --set PATH=VALUE, e.g.
#   --set 'roles.main.action.horizon=[16,32]'   --set inputs.depth=false
id: direct_action
label: Direct Action
summary: Each inference is one stateless request that must return an action chunk; the controller executes it.
paradigms: [direct]
status: builtin
references:
  - {title: "Astranomy: an empirical study of GPT-6 Astra as a native robot policy", url: "https://research.nvidia.com/labs/srl/projects/astranomy/", kind: project}
roles:
  main:
    description: Emits 3–15 action rows per inference from a sampled window of recent frames.
    channel: action                # the model emits actions itself (no agent loop, no tools)
    action:
      representation: abs_eef      # abs_eef: absolute end-effector pose | delta_eef: pose change (both via the environment's IK) | joint_abs: joint angles
      horizon: [3, 15]             # rows per chunk, [min, max]; each row runs for one control step
      history: [15, 7]             # frame window [span, stride]: frames t-14, t-7, t; [1, 1] = current frame only
      step_limits: [0.02, 0.1]     # largest translation (m) and rotation (rad) per row; larger requests are shortened
      blocks: [robot, timing, gripper, camera]   # prompt blocks; drop gripper/camera to remove geometry from the prompt
      custom_prompt: ""            # extra instructions appended to the prompt
      repair_attempts: 2           # re-ask on the same observation when the answer is malformed
      max_calls: 0                 # inference limit; 0 = until the episode ends
loop: {entry: main}
