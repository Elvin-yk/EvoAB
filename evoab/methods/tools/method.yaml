# One agent acts by calling tools. Change `act` to combine ways of acting:
#   act: [tools]                 call tools (this method)
#   act: [code]                  write programs that call the same tools      (see methods/code)
#   act: [action]                emit action chunks, one stateless request each (see methods/action)
#   act: [tools, code, action]   any combination; chunks and programs become calls in one session
# For one run: --set 'roles.main.act=[tools,action]'
id: tools
label: Tools
summary: One agent observes, calls tools and decides from their feedback in a persistent session.
status: builtin
inputs:                            # what the episode gives the agent; null keeps the environment's default
  depth: null
roles:
  main:
    description: Plans and acts with the shared scene, motion, skill and episode tools.
    act: [tools]
    capabilities: [skills, scene, gripper, episode]   # tool modules; narrow one with {id: gripper, tools: [move, hold]}
    # A VLA or world-action policy is a tool too: add `hybrid` (actor_act); your own: {id: user_tools, options: {file: my_tools.py}}
    style: full                    # compact: short results for minimal-harness baselines (act: [tools] only)
    initial_observation: false     # put an RGB observation in the first message (needs scene)
    prompt: {append: ""}           # extra method instructions
    max_turns: 0                   # 0 = until the episode ends
loop:
  entry: main
  episodes: {repeat: 1, carry: [], keep: success}   # carry [skills] or [programs] across repeated episodes
execution: {return_mode: background, resource_scheduling: per-resource}   # background: reasoning overlaps motion
