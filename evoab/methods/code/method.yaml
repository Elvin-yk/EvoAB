# One agent acts by writing Python programs that call the same tools, run with run_program.
# Combine with tools or action through `act`, e.g. --set 'roles.main.act=[tools,code]'.
id: code
label: Code
summary: The agent writes Python programs against the generated robot API, runs them and reads receipts and images.
status: builtin
references:
  - {title: "Code as Policies", url: "https://arxiv.org/abs/2209.07753"}
  - {title: "CaP-X: benchmarking and improving coding agents for robot manipulation", url: "https://arxiv.org/abs/2603.22435"}
roles:
  main:
    description: Programs call the same registered tools; image-dependent decisions end the program.
    act: [code]                    # without tools, only skill reading stays a direct call
    capabilities: [skills, scene, gripper, episode]   # the robot API the programs call
    prompt: {append: ""}           # extra method instructions
loop:
  entry: main
  # Keep programs across episodes and promote them after successes (as in RAX, arXiv 2610.22496):
  # episodes: {repeat: 5, carry: [programs], keep: success}
  episodes: {repeat: 1, carry: [], keep: success}
