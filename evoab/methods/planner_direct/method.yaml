id: planner_direct
label: Planner + Direct controller
summary: A tool-calling planner observes and splits the task; a stateless Direct controller executes each sub-goal.
paradigms: [orchestrate, direct]
status: experimental
references:
  - {title: "Hi Robot: open-ended instruction following with hierarchical VLA models", url: "https://arxiv.org/abs/2502.19417"}
  - {title: "Astranomy (Direct and Orchestrated forms)", url: "https://research.nvidia.com/labs/srl/projects/astranomy/", kind: project}
roles:
  planner:
    description: Observes, decomposes the task and hands sub-goals to the controller; never moves the robot itself.
    channel: tools
    capabilities:
      - skills
      - {id: scene, tools: [view_env_state, capture_scene]}
      - episode
      - {id: delegate, options: {roles: [controller]}}
    prompt:
      append: >-
        You cannot move the robot directly. Split the task into short, verifiable sub-goals and hand each
        to the controller with one precise instruction (which arm, which object, where, and what success
        looks like). After each hand-off, capture the scene and check the sub-goal before continuing.
        Submit finish only when the whole task is verified.
  controller:
    description: Executes one short sub-goal with up to 6 action chunks, then reports.
    channel: action
    action:                        # same settings as direct_action
      representation: abs_eef      # abs_eef | delta_eef | joint_abs
      horizon: [3, 15]             # rows per chunk, [min, max]
      history: [15, 7]             # frame window [span, stride]
      max_calls: 6                 # action chunks per sub-goal
loop: {entry: planner}
execution: {return_mode: immediate}
