id: rua_upstream
label: RUA (upstream package)
summary: The original uni-robot-agent package runs as an external evaluator against EvoAB's RoboDojo episode, for comparison with the native rua method.
paradigms: [orchestrate]
status: reproduction
integrations: [robodojo]
roles:
  main:
    description: RUA owns its planner, model calls and tool client; EvoAB owns the environment.
    brain: {agent: rua}
    channel: tools
    capabilities: [skills, scene, gripper, episode]
loop: {entry: main}
